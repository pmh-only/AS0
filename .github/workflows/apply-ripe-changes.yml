name: Apply RIPE changes

on:
  push:
    branches:
      - main
    paths:
      - "ripe/**/*.yml"

permissions:
  contents: read

concurrency:
  group: ripe-database
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Apply changed RIPE resources
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RIPE_API_AUTH: ${{ secrets.RIPE_API_AUTH }}
        run: |
          test -n "$RIPE_API_AUTH" || {
            echo "RIPE_API_AUTH repository secret is not configured" >&2
            exit 1
          }

          while IFS= read -r -d '' resource_path; do
            RESOURCE_PATH="$resource_path" python - <<'PY' > /tmp/ripe-target
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          import yaml

          path = Path(os.environ["RESOURCE_PATH"])
          if len(path.parts) != 3 or path.parts[0] != "ripe" or path.suffix != ".yml":
              raise ValueError(f"Invalid RIPE resource path: {path}")

          resource_type = path.parts[1]
          encoded_name = path.stem

          with open("resources.yml", encoding="utf-8") as config_file:
              configured = yaml.safe_load(config_file).get("resources", [])

          expected = {
              (resource["type"], quote(resource["name"], safe=""))
              for resource in configured
          }
          if (resource_type, encoded_name) not in expected:
              raise ValueError(f"Resource is not configured in resources.yml: {path}")

          with path.open(encoding="utf-8") as resource_file:
              document = yaml.safe_load(resource_file)

          objects = document.get("objects", {}).get("object", [])
          if len(objects) != 1:
              raise ValueError(f"{path} must contain exactly one RIPE object")

          resource = objects[0]
          if resource.get("type") != resource_type:
              raise ValueError(f"Object type does not match path: {path}")

          primary_key = resource.get("primary-key", {}).get("attribute", [])
          key = "".join(attribute["value"] for attribute in primary_key)
          if quote(key, safe="") != encoded_name:
              raise ValueError(f"Object primary key does not match path: {path}")

          source = resource.get("source", {}).get("id", "")
          if source.upper() != "RIPE":
              raise ValueError(f"Object source must be RIPE: {path}")

          attributes = []
          for attribute in resource.get("attributes", {}).get("attribute", []):
              clean_attribute = {
                  key: attribute[key]
                  for key in ("name", "value", "comment")
                  if key in attribute
              }
              if not isinstance(clean_attribute.get("name"), str):
                  raise ValueError(f"Attribute name must be a string: {path}")
              if not isinstance(clean_attribute.get("value"), str):
                  raise ValueError(f"Attribute value must be a string: {path}")
              attributes.append(clean_attribute)

          if not any(
              attribute["name"] == "source" and attribute["value"].upper() == "RIPE"
              for attribute in attributes
          ):
              raise ValueError(f"Object must contain a RIPE source attribute: {path}")

          payload = {
              "objects": {
                  "object": [{
                      "type": resource_type,
                      "source": {"id": "RIPE"},
                      "attributes": {"attribute": attributes},
                  }]
              }
          }
          with open("/tmp/ripe-update.json", "w", encoding="utf-8") as output_file:
              json.dump(payload, output_file, ensure_ascii=False)

          print(f"{resource_type}\t{encoded_name}")
          PY

            IFS=$'\t' read -r resource_type encoded_name < /tmp/ripe-target
            endpoint="https://rest.db.ripe.net/ripe/$resource_type/$encoded_name"

            curl --request PUT --fail-with-body --silent --show-error \
              --header "Authorization: Basic $RIPE_API_AUTH" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/ripe-update.json \
              "$endpoint?dry-run" >/dev/null

            curl --request PUT --fail-with-body --silent --show-error \
              --header "Authorization: Basic $RIPE_API_AUTH" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/ripe-update.json \
              "$endpoint" >/dev/null
          done < <(
            git diff --name-only --diff-filter=ACMRT -z \
              "$BEFORE_SHA" "$AFTER_SHA" -- 'ripe/**/*.yml'
          )
