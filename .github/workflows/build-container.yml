name: Build AS218822 containers

on:
  pull_request:
    paths:
      - ".github/workflows/build-container.yml"
      - "atlas/**"
      - "routing/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-container.yml"
      - "atlas/**"
      - "routing/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: bird-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    uses: ./.github/workflows/validate-bird.yml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ripe-atlas
            image: as218822-ripe-atlas
            context: atlas
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - component: ripe-atlas
            image: as218822-ripe-atlas
            context: atlas
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: bird
            image: as218822
            context: routing
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - component: bird
            image: as218822
            context: routing
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: looking-glass
            image: as218822-looking-glass
            context: routing/looking-glass
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - component: looking-glass
            image: as218822-looking-glass
            context: routing/looking-glass
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.image }}:${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pmh-only/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

      - name: Test Atlas registration address families
        if: matrix.component == 'ripe-atlas'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL_IMAGE: ${{ matrix.image }}:${{ matrix.architecture }}
          REMOTE_IMAGE: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
        run: |
          image="$LOCAL_IMAGE"
          if [ -n "$DIGEST" ]; then image="$REMOTE_IMAGE@$DIGEST"; fi
          for family in inet inet6 any; do
            docker run --rm --network none --entrypoint sh \
              --env SSH_ADDRESS_FAMILY="$family" \
              --volume "$PWD/atlas/test-entrypoint.sh:/test-entrypoint.sh:ro" \
              "$image" /test-entrypoint.sh
          done

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        include:
          - component: ripe-atlas
            image: as218822-ripe-atlas
          - component: bird
            image: as218822
          - component: looking-glass
            image: as218822-looking-glass
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.component }}-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Merge and publish manifests
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done

          digest_args=()
          for digest in *; do
            digest_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}:latest"
