name: Build Lagrange edge container

on:
  pull_request:
    paths:
      - ".github/workflows/build-edge-container.yml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/edge/lagrange/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-edge-container.yml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/edge/lagrange/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: lagrange-edge-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pmh-only/as218822-lagrange-edge

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: routing
          build-args: CONFIG_ROOT=edge/lagrange
          platforms: ${{ matrix.platform }}
          load: true
          tags: as218822-lagrange-edge:${{ matrix.architecture }}
          cache-from: type=gha,scope=lagrange-edge-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=lagrange-edge-${{ matrix.architecture }}

      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: routing
          build-args: CONFIG_ROOT=edge/lagrange
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=lagrange-edge-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=lagrange-edge-${{ matrix.architecture }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lagrange-edge-digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: lagrange-edge-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Merge and publish manifests
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done

          digest_args=()
          for digest in *; do
            digest_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
