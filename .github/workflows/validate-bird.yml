name: Validate BIRD configuration

on:
  pull_request:
    paths:
      - ".github/workflows/validate-bird.yml"
      - "routing/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-bird.yml"
      - "routing/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build BIRD image
        run: docker build --tag as218822-bird routing

      - name: Parse tracked configuration
        run: |
          docker run --rm \
            --env BIRD_VALIDATE=1 \
            --volume "$PWD/routing/bird:/etc/bird:ro" \
            --volume "$PWD/routing/tunnels:/etc/tunnels:ro" \
            as218822-bird render-bird-config

      - name: Parse Lagrange edge configuration
        run: |
          docker run --rm \
            --env BIRD_VALIDATE=1 \
            --volume "$PWD/routing/edge/lagrange/bird/bird.conf:/etc/bird/bird.conf:ro" \
            --volume "$PWD/routing/edge/lagrange/bird/local.conf:/etc/bird/local.conf:ro" \
            --volume "$PWD/routing/edge/lagrange/bird/peers:/etc/bird/peers:ro" \
            --volume "$PWD/routing/edge/lagrange/tunnels:/etc/tunnels:ro" \
            as218822-bird render-bird-config

      - name: Parse tunnel examples
        run: |
          docker run --rm \
            --env BIRD_VALIDATE=1 \
            --volume "$PWD/routing/tunnels/wireguard/wg-upstream.conf.example:/etc/tunnels/wireguard/wg-upstream.conf:ro" \
            --volume "$PWD/routing/tunnels/gre/gre-upstream.conf.example:/etc/tunnels/gre/gre-upstream.conf:ro" \
            --volume "$PWD/routing/bird/peers/wireguard.conf.example:/etc/bird/peers/wireguard.conf:ro" \
            --volume "$PWD/routing/bird/peers/gre.conf.example:/etc/bird/peers/gre.conf:ro" \
            --volume "$PWD/routing/tunnels/zerotier/network.conf.example:/etc/tunnels/zerotier/network.conf:ro" \
            --volume "$PWD/routing/bird/peers/zerotier.conf.example:/etc/bird/peers/zerotier.conf:ro" \
            as218822-bird render-bird-config
