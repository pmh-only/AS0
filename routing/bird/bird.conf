log stderr all;

include "/etc/bird/local.conf";

define LOCAL_AS = 218822;
define OWN_PREFIX = 2a06:9801:ff0::/44;

protocol device {
    scan time 10;
}

protocol direct direct_v6 {
    ipv6;
}

# Originate the aggregate and discard unmatched traffic. More-specific kernel
# routes still win by longest-prefix match.
protocol static originated_v6 {
    ipv6;
    route OWN_PREFIX blackhole;
}

protocol static tunnel_nexthops_v6 {
    ipv6;
    route fd00:200:21:1::17/128 via "hyehost-uk";
    route fd00:200:120:1::8/128 via "hyehost-us";
    route fd00:200:64:1::5/128 via "hyehost-nz";
}

filter export_own_v6 {
    if net = OWN_PREFIX && source = RTS_STATIC then accept;
    reject;
}

filter export_kernel_v6 {
    if net = OWN_PREFIX && source = RTS_STATIC then accept;
    if source = RTS_BGP then accept;
    reject;
}

protocol kernel kernel_v6 {
    ipv6 {
        import none;
        export filter export_kernel_v6;
    };
    merge paths on limit 16;
}

template bgp upstream_v6 {
    local as LOCAL_AS;
    graceful restart on;

    ipv6 {
        import none;
        export filter export_own_v6;
    };
}

include "/run/bird/peers/*.conf";
