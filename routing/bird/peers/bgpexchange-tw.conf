protocol bgp bgpexchange_tw_v6 from upstream_v6 {
    neighbor 2a0e:8f01:1000:78::1 as 24381;
    source address 2a0e:8f01:1000:78::117;

    ipv6 {
        import filter {
            if net !~ [2000::/3{12,48}] then reject;
            if net ~ OWN_PREFIX then reject;
            if bgp_path.len = 0 then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}
