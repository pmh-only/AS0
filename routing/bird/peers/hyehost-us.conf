protocol bgp hyehost_us from upstream_v6 {
    neighbor fd00:200:120:1::8 as 47272;
    source address fd00:200:120::8;
    multihop 2;

    hold time 90;
    keepalive time 30;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 190;
            accept;
        };
        import limit 500000 action restart;
    };
}
