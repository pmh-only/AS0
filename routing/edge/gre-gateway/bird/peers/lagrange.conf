protocol bgp lagrange_v6 from upstream_v6 {
    neighbor fd:e82c::1 as 209735;
    source address fd:e82c::2;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 210;
            accept;
        };
        import limit 500000 action restart;
    };
}
