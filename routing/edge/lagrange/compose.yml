services:
  edge:
    image: ghcr.io/pmh-only/as218822-lagrange-edge:latest
    container_name: as218822-lagrange-edge
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ENABLE_IPV6_FORWARDING: "1"
      IPV6_FORWARDING_PATH: /run/sysctl/ipv6-forwarding
    env_file:
      - ./bird/.env.keys
    tmpfs:
      - /run/bird:mode=0755,size=1m
    volumes:
      - /proc/sys/net/ipv6/conf/all/forwarding:/run/sysctl/ipv6-forwarding
