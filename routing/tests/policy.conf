router id 192.0.2.1;
include "/etc/bird-policy.conf";

protocol static test_roas {
    roa6 { table rpki6; };
    route 2001:4860::/32 max 48 as 15169;
}

protocol static fixtures {
    ipv6 {
        import filter {
            bgp_path.empty;
            if net = 2001:4860::/32 then bgp_path.prepend(15169);
            else if net = 2606:4700:1::/48 then bgp_path.prepend(64512);
            else bgp_path.prepend(13335);
            accept;
        };
    };
    route 2606:4700::/32 blackhole;
    route 2001:4860::/32 blackhole;
    route 2001:4860:1::/48 blackhole;
    route 2606:4700:1::/48 blackhole;
    route 2606:4700:2::/64 blackhole;
    route 2a06:9801:ff0::/44 blackhole;
    route 2a06:9801:ff0::/48 blackhole;
    route fd00:ac:4727:3::/127 blackhole;
    route 2001:db8::/32 blackhole;
    route 3fff::/20 blackhole;
    route ::/0 blackhole;
}
